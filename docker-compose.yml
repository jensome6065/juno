services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: juno
      POSTGRES_PASSWORD: juno
      POSTGRES_DB: juno
    ports:
      - "5432:5432"
    volumes:
      - juno_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juno -d juno"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  juno_pg:
